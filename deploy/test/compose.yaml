services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: logbook-test-postgres
    environment:
      POSTGRES_USER: logbook
      POSTGRES_PASSWORD: test_only_password
      POSTGRES_DB: logbook_test
      TZ: UTC
    command:
      - postgres
      - -c
      - max_connections=20
      - -c
      - shared_buffers=32MB
      - -c
      - work_mem=4MB
    ports:
      - "127.0.0.1:${LOGBOOK_TEST_DB_PORT:-15432}:5432"
    volumes:
      - ../../sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 1s
      timeout: 3s
      retries: 60
