services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: logbook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: logbook
      POSTGRES_PASSWORD: logbook_dev_secret
      POSTGRES_DB: logbook
      TZ: Asia/Shanghai
    command: >
      postgres
      -c shared_buffers=32MB
      -c work_mem=4MB
      -c max_connections=10
      -c timezone=Asia/Shanghai
      -c log_timezone=Asia/Shanghai
    ports:
      - "127.0.0.1:5432:5432"
    deploy:
      resources:
        limits:
          memory: 128M
    volumes:
      - pgdata:/var/lib/postgresql
      - ./sql:/docker-entrypoint-initdb.d:ro

  app:
    image: logbook:0.5.3
    build: .
    container_name: logbook-app
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://logbook:logbook_dev_secret@postgres:5432/logbook
      - SSH_HOST=0.0.0.0
      - TZ=Asia/Shanghai
    ports:
      - "127.0.0.1:2222:22"
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
    name: logbook_pgdata
