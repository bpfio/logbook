[project]
name = "logbook"
version = "0.3.0"
description = "Agent-Native Industrial Task Ledger, Root Cause DevLog, and Long-Term Memory Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "asyncpg>=0.30.0",
    "mcp>=1.0.0",
    "rich>=13.8.0",
    "httpx>=0.28.0",
    "asyncssh>=2.20.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
logbook = "logbook.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logbook"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
